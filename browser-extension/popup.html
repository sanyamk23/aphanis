<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin:0; padding:16px; font-family:-apple-system,sans-serif; width:380px; }
    h1 { font-size:16px; margin:0 0 12px; color:#333; }
    button { width:100%; padding:10px; margin:6px 0; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
    #clean { background:#6366f1; color:white; }
    #humanize { background:#10b981; color:white; }
    #sanitize { background:#f59e0b; color:white; }
    #pasteArea { width:100%; height:120px; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; resize:vertical; }
    #result { width:100%; height:120px; padding:8px; border:1px solid #ddd; border-radius:6px; font-size:14px; resize:vertical; margin-top:8px; background:#f9f9f9; }
    .status { font-size:12px; color:#666; margin-top:4px; }
    .badge { display:inline-block; background:#ef4444; color:white; padding:2px 6px; border-radius:4px; font-size:10px; }
  </style>
</head>
<body>
  <h1>🛡️ Untrace AI</h1>
  <p style="font-size:13px;color:#666;margin:0 0 12px;">Remove AI watermarks in one click</p>

  <textarea id="pasteArea" placeholder="Paste AI-generated text here..."></textarea>

  <button id="clean" onclick="cleanText()">🧹 Remove watermarks & em-dashes</button>
  <button id="humanize" onclick="humanizeText()">🗣️ Make it sound human</button>
  <button id="sanitize" onclick="sanitizeAll()">🧼 Full sanitize (all features)</button>

  <div class="status" id="status"></div>
  <textarea id="result" readonly placeholder="Result will appear here..."></textarea>

  <script src="popup.js"></script>
</body>
</html>
