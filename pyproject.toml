[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "untrace-ai"
version = "1.0.0"
description = "Untrace AI - Ultimate AI Provenance, Watermark & Metadata Sanitizer for LLMs, Claude, and Media."
readme = "README.md"
authors = [
    { name = "Sanya", email = "sanya@example.com" }
]
keywords = [
    "watermark-remover",
    "c2pa",
    "ai-watermark",
    "zero-width-spaces",
    "provenance",
    "claude-skill",
    "mcp-server",
    "llm-hygiene"
]
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "mcp>=1.0.0",
]

[project.scripts]
untrace = "untrace.cli:main"
watermark-remover = "untrace.cli:main"

[tool.setuptools.packages.find]
include = ["untrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
