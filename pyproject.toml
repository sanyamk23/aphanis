[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aphanis"
version = "1.4.1"
description = "Aphanis :: Enterprise Zero-Trust AI Provenance Firewall, Automatic Humanizer Engine & Stego Matrix."
readme = "README.md"
authors = [
    { name = "Sanyam Kumat", email = "sanyamkumat2305@gmail.com" }
]
keywords = [
    "ai-provenance-firewall",
    "stealth-engine",
    "automatic-humanizer",
    "clipboard-daemon",
    "git-pre-commit-hook",
    "stego-risk-matrix",
    "audit-certificate",
    "forensics-heatmap",
    "ipynb-sanitizer",
    "spectral-dct-noise",
    "c2pa",
    "zero-width-spaces",
    "shannon-entropy",
    "claude-skill",
    "mcp-server"
]
requires-python = ">=3.9"
dependencies = [
    "pillow>=9.0.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "mcp>=1.0.0",
]

[project.scripts]
aphanis = "aphanis.cli:main"
watermark-remover = "aphanis.cli:main"

[tool.setuptools.packages.find]
include = ["aphanis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
